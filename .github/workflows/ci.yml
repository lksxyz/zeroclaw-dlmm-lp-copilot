name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install python (for TOML parse)
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: install jq
        run: sudo apt-get install -y jq

      - name: validate config.example.toml
        run: ./scripts/validate-config.sh

      - name: validate skill frontmatter
        run: ./scripts/validate-skills.sh

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test (host) — dlmm-core
        working-directory: plugins/dlmm-core
        run: cargo test --locked

      - name: cargo test (host) — dlmm-reader
        working-directory: plugins/dlmm-reader
        run: cargo test --locked

      - name: cargo test (host) — dlmm-builder
        working-directory: plugins/dlmm-builder
        run: cargo test --locked

  fixtures:
    name: fixtures-reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install fixture tool deps
        working-directory: tools
        run: npm install

      - name: regenerate fixtures from SDK sources
        working-directory: tools
        run: node gen-fixtures.cjs

      - name: fixtures.json must be byte-identical
        working-directory: plugins/dlmm-core
        run: git diff --exit-code -- tests/fixtures.json
