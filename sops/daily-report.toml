# Daily DLMM position report — 08:00 local (America/Sao_Paulo default)
# ----------------------------------------------------------------------
# Calls meteora-position (T0), formats via meteora-report (T0), DMs Telegram.
# Zero keys held. Read-only end to end.
# ----------------------------------------------------------------------

[id]
name = "dlmm-daily-report"
description = "Daily DLMM position summary to Telegram"
custody = "T0"
autonomy_required = "supervised"          # cron origin is on the allow-list

[trigger]
kind = "cron"
expr = "0 8 * * *"
tz   = "America/Sao_Paulo"

[steps.fetch]
kind = "skill"
name = "meteora-position"
input = { wallet = "${skills.meteora.wallet_pubkey}" }
timeout_seconds = 30
on_error = "abort_with_user_dm"           # don't silently fail

[steps.format]
kind = "skill"
name = "meteora-report"
input_from = "fetch.output"

[steps.send]
kind = "channel_send"
channel = "telegram.dlmm_copilot"
target  = "${skills.meteora.report_chat_id}"
body_from = "format.output"
on_error = "log_and_continue"             # we already have the body, retry send separately

[steps.persist_baseline]
kind = "memory_write"
key_pattern = "baseline_position_value_<id>"
value_from = "fetch.output[*].value_usd"
on_error = "log_and_continue"             # non-critical; next run will rewrite

[approval]
required = false                          # no fund movement
