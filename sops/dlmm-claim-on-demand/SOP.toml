# On-demand claim fee (Telegram DM "claim #<position_id>")
#
# The agent never holds keys. It calls `meteora-claim` to build an unsigned
# transaction and returns a Solana Action URL for the operator to tap and
# sign in their wallet.

[sop]
name = "dlmm-claim-on-demand"
version = "1.0.0"
description = "Operator-initiated fee claim via Telegram DM."
priority = "normal"
max_concurrent = 1
cooldown_secs = 0
admission_policy = "coalesce"

[[triggers]]
type = "channel"
channel = "telegram"
alias = "dlmm_copilot"