# Out-of-range + IL + fee-milestone monitor — every 30 minutes
# ----------------------------------------------------------------------
# Read-only. If a position slipped out of range, IL crossed the threshold,
# or pending fees cleared the milestone, DM Telegram urgently.
# ----------------------------------------------------------------------

[id]
name = "dlmm-range-monitor"
description = "Alert on out-of-range / IL / fee milestone"
custody = "T0"
autonomy_required = "supervised"

[trigger]
kind = "cron"
expr = "*/30 * * * *"

[steps.fetch]
kind = "skill"
name = "meteora-position"
input = { wallet = "${skills.meteora.wallet_pubkey}" }
timeout_seconds = 30
on_error = "abort_with_user_dm"

# Dedupe: do not re-alert on the same condition within 4 hours.
[steps.dedupe]
kind = "memory_check"
key_pattern = "alert_sent_<id>_<condition>"
ttl_seconds = 14400                       # 4h
on_hit = "skip_remaining_steps"

[steps.evaluate]
kind = "branch"

# branches: array-of-tables, evaluated top-to-bottom; first match wins
[[steps.evaluate.branches]]
when = "fetch.output[*].status == 'out-of-range'"
goto = "alert_oor"

[[steps.evaluate.branches]]
when = "fetch.output[*].il_pct < -${skills.meteora.thresholds.il_alert_pct}"
goto = "alert_il"

[[steps.evaluate.branches]]
when = "fetch.output[*].claimable_usd >= ${skills.meteora.thresholds.fee_milestone_usd}"
goto = "alert_fees"

[steps.evaluate.else]
goto = "end"

[steps.alert_oor]
kind = "channel_send"
channel = "telegram.dlmm_copilot"
target  = "${skills.meteora.report_chat_id}"
body = """
⚠️ #<id> <X>/<Y> OUT OF RANGE
  range: bins <low>..<high>  active: <active_id>
  → say `rebalance #<id>` to propose a new range
"""
body_template_from = "fetch.output"

[steps.alert_il]
kind = "channel_send"
channel = "telegram.dlmm_copilot"
target  = "${skills.meteora.report_chat_id}"
body = """
⚠️ #<id> <X>/<Y> IL <pct>%  (threshold <threshold>%)
  value: $<usd>  HODL line: $<hodl>
  → review position; consider `rebalance #<id>`
"""
body_template_from = "fetch.output"

[steps.alert_fees]
kind = "channel_send"
channel = "telegram.dlmm_copilot"
target  = "${skills.meteora.report_chat_id}"
body = """
💰 #<id> <X>/<Y> claimable fees $<usd>  (milestone $<threshold>)
  → say `claim #<id>` to prepare
"""
body_template_from = "fetch.output"

[steps.persist_alert]
kind = "memory_write"
key_pattern = "alert_sent_<id>_<condition>"
value = { sent_at = "${now}", payload_ref = "<step_input_id>" }
on_error = "log_and_continue"

[approval]
required = false                          # alert only, no funds move
