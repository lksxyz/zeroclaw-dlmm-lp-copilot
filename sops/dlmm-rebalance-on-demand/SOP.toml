# On-demand rebalance (Telegram DM "rebalance #<position_id>")
#
# Requires the Action endpoint and a durable nonce account. Builds an
# unsigned removeLiquidity + addLiquidity pair and returns a Solana
# Action URL for the operator to tap and sign.

[sop]
name = "dlmm-rebalance-on-demand"
version = "1.0.0"
description = "Operator-initiated DLMM position rebalance via Telegram DM."
priority = "normal"
max_concurrent = 1
cooldown_secs = 0
admission_policy = "coalesce"

[[triggers]]
type = "channel"
channel = "telegram"
alias = "dlmm_copilot"