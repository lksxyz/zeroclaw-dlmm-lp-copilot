[package]
name = "dlmm-core"
version = "0.1.0"
edition = "2021"
# MIT matches the repo root LICENSE (bounty requires MIT on plugin code).
license = "MIT"
description = "Shared pure core for the DLMM plugin suite: decode Meteora DLMM accounts, build claim/rebalance transactions, durable-nonce helpers, mechanical validation. Host-testable; the wasm shims (dlmm-reader / dlmm-builder) depend on this."
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Solana primitives — pure crates, no SDK weight.
solana-pubkey = { version = "2", features = ["borsh"] }
solana-instruction = "2"
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false }

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
