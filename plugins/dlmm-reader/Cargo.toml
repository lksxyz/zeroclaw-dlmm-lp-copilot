[package]
name = "dlmm-reader"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT plugin: read Meteora DLMM positions and emit a shaped, ~200-token per-position summary."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# pure core deps — also used by host tests
borsh = { version = "1", features = ["derive"] }
solana-pubkey = { version = "2", features = ["borsh"] }
solana-instruction = "2"

# wasm-only deps (shaping step)
base64 = "0.22"

[dev-dependencies]
borsh = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
