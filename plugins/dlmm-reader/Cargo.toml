[package]
name = "dlmm-reader"
version = "0.1.0"
edition = "2021"
# MIT matches the repo root LICENSE (bounty requires MIT on plugin code).
license = "MIT"
description = "ZeroClaw WIT tool plugin: fetch Meteora DLMM positions + durable-nonce settlement status in-wasm (waki), decode, validate mechanically, and emit a shaped report."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared pure core: decode, nonce helpers, PDA, tx building, mechanical
# validation, waki JSON-RPC. Wasm-only deps live in dlmm-core's cfg section.
dlmm-core = { path = "../dlmm-core" }
solana-pubkey = { version = "2" }

# Pinned against ZeroClaw runtime 0.8.4. See wit/UPSTREAM_REF.md; cargo build
# uses --locked so Cargo.lock is the authoritative resolver.
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
# strip = true  # keep symbols until the report panic is confirmed fixed live
codegen-units = 1
panic = "unwind"

[workspace]
