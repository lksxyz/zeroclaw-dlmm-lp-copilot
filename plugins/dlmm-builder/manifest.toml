name = "dlmm-builder"
version = "0.1.0"
description = "Build unsigned Meteora DLMM claim/rebalance transactions in-wasm: durable-nonce recentBlockhash, mechanical validation (ownership, claimable, range contains active bin), emits a solana-action: URL."
author = "DLMM LP Copilot contributors"
wasm_path = "dlmm_builder.wasm"
capabilities = ["tool"]
permissions = ["http_client", "config_read"]

# Host-gated: this plugin is part of the DLMM LP Copilot submission
# and lives in the submission repo, not the upstream registry.
registry = false
