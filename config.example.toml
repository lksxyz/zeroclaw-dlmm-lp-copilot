# DLMM LP Copilot — config.example.toml
#
# Copy to ~/.zeroclaw/config.toml and fill in ${ENV_VAR} placeholders.
# All secrets are encrypted at rest and read via `config_read`.
#
# This file mirrors the operator's runtime shape (ZeroClaw 0.8.4):
# - `schema_version = 3` is required by the runtime; older shapes fail to load.
# - The `dlmm` risk profile uses *excluded_tools* to hard-deny destructive tools
#   rather than only approval-gating them. Approval-gating alone is bypassable if
#   the operator forgets to inspect a request on Telegram.
# - Cron triggers live in `[sops.triggers.*]` (config-side) AND in each
#   `sops/dlmm-*/SOP.toml` (SOP-side). ZeroClaw 0.8.4 dedupes by SOP name,
#   so the two definitions are equivalent and intentional: config-side wins
#   for TZ, SOP-side wins for steps.

schema_version = 3

# ---------- providers ----------
# LLM via OpenRouter (prepaid, no direct Anthropic key needed).
# Pick a model id from https://openrouter.ai/models (a `:free` suffix variant
# also exists). Alternative direct-API shape:
#   [providers.models.anthropic.copilot]
#   model    = "claude-sonnet-4-5"
#   api_key  = "${ANTHROPIC_API_KEY}"
[providers.models.openrouter.copilot]
model   = "anthropic/claude-sonnet-4-5"
api_key = "${OPENROUTER_API_KEY}"

# ---------- agents ----------
[agents.dlmm_copilot]
channels        = ["telegram.dlmm_copilot"]
risk_profile    = "dlmm"
model_provider  = "openrouter.copilot"
runtime_profile = "copilot"
skill_bundles   = ["meteora"]

# ---------- peer groups ----------
# The Telegram chat the agent DM's. Use @userinfobot to find your chat id.
[peer_groups.telegram_dlmm_copilot_default]
channel        = "telegram.dlmm_copilot"
external_peers = ["${TELEGRAM_CHAT_ID}"]

# ---------- channels ----------
[channels.telegram.dlmm_copilot]
bot_token            = "${TELEGRAM_BOT_TOKEN}"
enabled              = true
poll_interval_seconds = 5
sender_match         = "handle"

# ---------- onboard state ----------
[onboard_state]
quickstart_completed = true

# ---------- skill bundles ----------
[skill_bundles.meteora]

# ---------- risk profiles ----------
# `dlmm` is the only profile the agent uses. It is the *deny-by-default* shape:
# filesystem + web tools are excluded outright, and so is `http_request` — ALL
# outbound traffic goes through the dlmm-reader/dlmm-builder plugins (their
# `http_client` grant is host-scoped and their config is host-injected, so the
# LLM cannot redirect the RPC or tamper with the config).
#
# Mirrors the live operator config and survives a misconfigured quickstart.
[risk_profiles.dlmm]
level                            = "supervised"
require_approval_for_medium_risk = false
auto_approve                     = [
    "send_message_to_peer",
    "read_skill",
    "memory_recall",
]
excluded_tools = [
    "http_request",
    "content_search",
    "glob_search",
    "file_read",
    "file_write",
    "file_edit",
    "data_management",
    "memory_export",
    "cron_list",
    "web_fetch",
    "browser",
    "web_search_tool",
    "weather",
]

[risk_profiles.dlmm.delegation_policy]
mode = "allow"

# ---------- runtime profile ----------
# Same shape as the operator's `unbounded` profile, but trimmed: lower caps so a
# forked starter kit can't accidentally blow the context window or spend.
[runtime_profiles.copilot]
agentic                 = true
agentic_timeout_secs    = 600
compact_context         = true
delegation_timeout_secs = 300
keep_tool_context_turns = 6
max_actions_per_hour    = 120
max_context_tokens      = 64000
max_cost_per_day_cents  = 500
max_delegation_depth    = 3
max_history_messages    = 100
max_system_prompt_chars = 32000
max_tool_iterations     = 50
max_tool_result_chars   = 16000
memory_recall_limit     = 10
parallel_tools          = true
shell_timeout_secs      = 120
strict_tool_parsing     = true

[runtime_profiles.copilot.context_compression]
enabled                  = true
identifier_policy        = "strict"
max_passes               = 2
protect_first_n          = 3
protect_last_n           = 4
source_max_chars         = 32000
summary_max_chars        = 2000
threshold_ratio          = 0.6
timeout_secs             = 30
tool_result_retrim_chars = 1500

[runtime_profiles.copilot.thinking]
default_level   = "medium"
native_thinking = false

# ---------- memory ----------
[memory]
backend     = "sqlite.sqlite"
search_mode = "bm25"

# ---------- skills ----------
# RPC access, the nonce pool, and the operator wallet moved into the plugin
# sections below — the skills only keep SOP thresholds.
[skills.meteora]
report_chat_id = "${TELEGRAM_CHAT_ID}"

[skills.meteora.thresholds]
out_of_range_alert  = true
il_alert_pct        = 5.0
fee_milestone_usd   = 1.0
daily_report_hour   = 8
daily_report_tz     = "America/Sao_Paulo"
range_check_minutes = 30

# ---------- sops ----------
# Config-side cron definitions (ZeroClaw 0.8.4 reads these for TZ-aware triggers).
# Each SOP under sops/dlmm-*/SOP.toml also carries its own [[triggers]] block —
# the runtime dedupes by SOP name. Config-side wins on TZ, SOP-side wins on steps.
[sops.triggers.dlmm-daily-report]
kind = "cron"
expr = "0 8 * * *"
tz   = "America/Sao_Paulo"

[sops.triggers.dlmm-range-monitor]
kind = "cron"
expr = "*/30 * * * *"
tz   = "America/Sao_Paulo"

# ---------- plugins ----------
# The whole Solana surface lives in the two WASM plugins. `http_request` is
# excluded above, so these sections are the ONLY outbound path in the agent.
#
# The host injects each entry's `config` map into the tool's execute args
# under the reserved `__config` key (gated by the manifest's `config_read`
# permission); caller-supplied `__config` is stripped, so the LLM can't
# redirect the RPC or change the signer wallet.
# The first entry must be hand-added — `zeroclaw config set` can't
# materialize a plugins.entries node for a freshly installed plugin.
# NOTE: `plugins.entries` is a TOML array of tables (natural key `name`),
# not a `[plugins.entries.<name>.config]` table — the latter resets the
# whole `plugins` section to defaults at load.
[plugins]
enabled = true

[[plugins.entries]]
name = "dlmm-reader"
# Inline tables must stay on ONE line — TOML 1.0 forbids newlines inside
# braces, and Python ≥3.14's tomllib (used by validate-config.sh) rejects
# them. ZeroClaw's config loader needs the nested `config` node inline
# (a `[plugins.entries.config]` table resets `plugins` to defaults).
config = { rpc_url = "${SOLANA_RPC_URL}", owner_pubkey = "${OPERATOR_WALLET_PUBKEY}", dlmm_program = "LBUZKhRxPF3XUpBCjp4YzTKgLccjZhTSDM9YuVaPwxo" }

[[plugins.entries]]
name = "dlmm-builder"
config = { rpc_url = "${SOLANA_RPC_URL}", owner_pubkey = "${OPERATOR_WALLET_PUBKEY}", dlmm_program = "LBUZKhRxPF3XUpBCjp4YzTKgLccjZhTSDM9YuVaPwxo", nonce_address = "${DURABLE_NONCE_ADDRESS}" }
